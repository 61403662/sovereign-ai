<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sovereign-ai 本地问答</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    textarea { width: 100%; min-height: 5rem; font-size: 1rem; padding: 0.5rem; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    #answer { white-space: pre-wrap; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>本地文档问答</h1>
  <p>仅本机 127.0.0.1；数据与模型在 Deploy，不经公网。</p>
  <label for="q">问题</label>
  <textarea id="q" placeholder="输入问题…"></textarea>
  <button type="button" id="go">提问</button>
  <p id="status" aria-live="polite"></p>
  <div id="clarify" hidden></div>
  <div id="answer"></div>
  <ul id="cites"></ul>
  <script>
    const q = document.getElementById("q");
    const go = document.getElementById("go");
    const status = document.getElementById("status");
    const clarifyBox = document.getElementById("clarify");
    const answer = document.getElementById("answer");
    const cites = document.getElementById("cites");

    async function postAsk(question, clarifyChoice) {
      const body = { question };
      if (clarifyChoice) body.clarify_choice = clarifyChoice;
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const text = await res.text();
      return { res, data: JSON.parse(text) };
    }

    function showClarify(data) {
      clarifyBox.hidden = false;
      clarifyBox.innerHTML = "";
      const p = document.createElement("p");
      p.textContent = data.prompt || "请先选择要哪一种回答：";
      clarifyBox.appendChild(p);
      (data.options || []).forEach((opt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt.label || opt.id;
        btn.style.marginRight = "0.5rem";
        btn.addEventListener("click", () => runAsk(q.value.trim(), opt.id));
        clarifyBox.appendChild(btn);
      });
    }

    async function runAsk(question, clarifyChoice) {
      if (!question) return;
      go.disabled = true;
      clarifyBox.hidden = true;
      clarifyBox.innerHTML = "";
      status.textContent = "检索与生成中…";
      answer.textContent = "";
      cites.innerHTML = "";
      try {
        let data;
        try {
          ({ data } = await postAsk(question, clarifyChoice));
        } catch (_) {
          status.textContent = "响应不是合法 JSON（看 serve Traceback）";
          return;
        }
        if (!data.ok) {
          status.textContent = data.error || "失败";
          return;
        }
        const bits = [];
        if (data.route) bits.push(`路由: ${data.route}`);
        if (data.routes && data.routes.length) bits.push(`(${data.routes.join(" + ")})`);
        if (data.intent) bits.push(`intent: ${data.intent}`);
        status.textContent = bits.join(" · ");
        if (data.clarify) {
          showClarify(data);
          answer.textContent = "";
          return;
        }
        answer.textContent = data.answer || "";
        cites.innerHTML = "";
        if (data.citations_text) {
          const li = document.createElement("li");
          li.textContent = data.citations_text;
          cites.appendChild(li);
        }
        (data.citations || []).forEach((c) => {
          const li = document.createElement("li");
          li.textContent = `${c.source || ""}#${c.heading || ""}`;
          cites.appendChild(li);
        });
      } catch (e) {
        status.textContent =
          "无法连接 /api/ask（serve 窗口是否仍开着？地址须为 http://127.0.0.1:8787 ）";
      } finally {
        go.disabled = false;
      }
    }

    go.addEventListener("click", () => runAsk(q.value.trim(), null));
  </script>
</body>
</html>
