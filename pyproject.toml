[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-ai"
version = "0.1.0"
description = "Local sovereign AI: minimal RAG with citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["sovereign_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
